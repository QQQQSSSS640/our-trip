<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅行手札</title>
  
  <!-- App 圖示 -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="shortcut icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFCF6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="旅行手札">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase 10.8.0 核心庫 -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'washi': '#FFFCF6',     // 和紙白
            'sumi': '#3E3A39',      // 墨灰粗線條
            'coral': '#F2A497',     // 珊瑚粉
            'yamabuki': '#F6D27A',  // 山吹黃
            'mizu': '#A8D3E6',      // 水色
            'wakatake': '#B9DAA5',  // 若竹綠
          },
          fontFamily: {
            sans: ['"Zen Maru Gothic"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'comic': '4px 4px 0px #3E3A39',
            'comic-sm': '2.5px 2.5px 0px #3E3A39',
            'comic-lg': '6px 6px 0px #3E3A39',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #FFFCF6;
      color: #3E3A39;
      font-family: 'Zen Maru Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .border-comic { border: 3px solid #3E3A39; }
    .border-b-comic { border-bottom: 3px solid #3E3A39; }
    .border-t-comic { border-top: 3px solid #3E3A39; }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float { animation: gentleFloat 4s ease-in-out infinite; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .todo-strike.checked span.todo-text {
      color: #9CA3AF;
      text-decoration: line-through;
      text-decoration-thickness: 2.5px;
      text-decoration-color: #F2A497;
    }
  </style>
</head>
<body class="bg-washi min-h-screen text-sumi flex flex-col items-center">

  <!-- 頂端導航列 -->
  <header class="sticky top-0 z-40 w-full max-w-md md:max-w-xl bg-washi border-b-comic px-4 py-2.5 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <!-- 點擊手帳圖示直接打開旅程切換與管理 -->
      <button onclick="openTripManagerModal()" class="w-8 h-8 rounded-full bg-coral border-comic flex items-center justify-center text-xs font-black shadow-comic-sm hover:scale-105 active:scale-95 transition-transform" title="切換或建立新旅程">
        📖
      </button>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 id="nav-title" class="font-extrabold text-sm tracking-wide truncate max-w-[130px]">旅行手札</h1>
          <button onclick="openTripManagerModal()" class="text-[11px] font-black text-gray-400 hover:text-sumi">▾ 切換</button>
        </div>
        <div class="flex items-center gap-1">
          <span id="lock-status-badge" onclick="promptUnlockPin()" class="cursor-pointer text-[10px] font-black px-1.5 py-0.2 rounded bg-washi border-comic">
            🔒 訪客模式
          </span>
        </div>
      </div>
    </div>
    
    <div class="flex items-center gap-1.5">
      <button onclick="openShareModal()" class="px-2.5 py-1.5 bg-mizu rounded-xl border-comic text-xs font-black flex items-center gap-1 shadow-comic-sm active:translate-y-0.5">
        <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
        <span>分享</span>
      </button>
      <button onclick="openTripManagerModal()" class="px-2.5 py-1.5 bg-yamabuki rounded-xl border-comic text-xs font-black flex items-center gap-1 shadow-comic-sm active:translate-y-0.5">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span>新計畫</span>
      </button>
    </div>
  </header>

  <!-- 主容器 -->
  <main class="w-full max-w-md md:max-w-xl px-4 py-4 space-y-7 pb-24">

    <!-- HERO 區塊 -->
    <section id="hero" class="relative bg-white rounded-3xl border-comic p-5 shadow-comic overflow-hidden">
      <button onclick="protectedAction(openTripMetaModal)" class="absolute top-3 right-3 p-2 rounded-xl bg-yamabuki border-comic text-xs font-black flex items-center gap-1 shadow-comic-sm active:translate-y-0.5">
        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
        <span>設定</span>
      </button>

      <div class="w-full h-32 flex items-center justify-center my-1 select-none">
        <svg viewBox="0 0 400 130" class="w-full h-full max-h-32" fill="none">
          <polygon points="200,15 130,115 270,115" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M 200,15 L 170,55 Q 185,60 200,50 Q 215,60 230,55 Z" fill="#FFFFFF" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="140" cy="35" r="14" fill="#F2A497" stroke="#3E3A39" stroke-width="3" />
          <path d="M -10 115 Q 80 105 170 115 T 410 115 L 410 130 L -10 130 Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" />
          <g class="animate-float">
            <rect x="250" y="90" width="85" height="24" rx="7" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
            <rect x="260" y="96" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#3E3A39" stroke-width="2"/>
            <rect x="282" y="96" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#3E3A39" stroke-width="2"/>
            <rect x="304" y="96" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#3E3A39" stroke-width="2"/>
            <circle cx="270" cy="114" r="4.5" fill="#3E3A39" />
            <circle cx="315" cy="114" r="4.5" fill="#3E3A39" />
          </g>
        </svg>
      </div>

      <div class="text-center mt-1">
        <div class="inline-block px-3 py-1 bg-yamabuki rounded-full border-comic text-xs font-black mb-1.5 shadow-comic-sm">
          📍 <span id="hero-dest">載入中...</span>
        </div>
        <h2 id="hero-title" class="text-2xl font-black tracking-wide text-sumi">旅行手札</h2>
        <p id="hero-date-range" class="text-xs font-bold text-gray-600 mt-1">2026/11/20 ~ 2026/11/25</p>
      </div>

      <div class="mt-4 p-3 bg-washi rounded-2xl border-comic flex items-center justify-around text-center shadow-comic-sm">
        <div>
          <span class="text-xs font-bold text-gray-500 block">出發日</span>
          <span id="hero-start-date" class="text-xs font-black">-</span>
        </div>
        <div class="w-0.5 h-7 bg-sumi"></div>
        <div>
          <span class="text-xs font-bold text-gray-500 block">距離啟程</span>
          <div class="flex items-baseline justify-center gap-1">
            <span class="text-xs font-black">倒數</span>
            <span id="hero-countdown-days" class="text-2xl font-black text-coral">-</span>
            <span class="text-xs font-black">天</span>
          </div>
        </div>
        <div class="w-0.5 h-7 bg-sumi"></div>
        <div>
          <span class="text-xs font-bold text-gray-500 block">旅伴人數</span>
          <span id="hero-partner-count" class="text-sm font-black">-</span>
        </div>
      </div>
    </section>

    <!-- 每日行程時間軸 -->
    <section id="itinerary" class="space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-3.5 h-7 bg-coral rounded-full border-comic"></div>
          <h2 class="text-xl font-black">每日行程時間軸</h2>
        </div>
        <button onclick="protectedAction(() => openAddItemModal())" class="px-3 py-1.5 bg-wakatake rounded-2xl border-comic text-xs font-black flex items-center gap-1 shadow-comic-sm hover:scale-105 active:scale-95 transition-transform">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>新增行程</span>
        </button>
      </div>

      <div id="day-tabs-container" class="flex gap-2 overflow-x-auto no-scrollbar py-1 px-0.5"></div>

      <div id="timeline-container" class="relative pl-6 space-y-4 mt-2">
        <div class="absolute left-2.5 top-3 bottom-3 w-1 bg-sumi rounded-full -translate-x-1/2"></div>
      </div>
    </section>

    <!-- 交通與住宿 -->
    <section id="transport-hotel" class="space-y-4">
      <div class="flex items-center gap-2">
        <div class="w-3.5 h-7 bg-mizu rounded-full border-comic"></div>
        <h2 class="text-xl font-black">交通票券與住宿</h2>
      </div>

      <div class="bg-white rounded-3xl border-comic p-4 shadow-comic space-y-3">
        <div class="flex items-center justify-between border-b-comic pb-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg bg-yamabuki border-comic flex items-center justify-center text-xs">🚄</span>
            <h3 class="font-black text-base">交通資訊</h3>
          </div>
          <button onclick="protectedAction(() => openAddTransportModal())" class="px-2.5 py-1 bg-yamabuki rounded-xl border-comic text-xs font-black shadow-comic-sm">
            + 新增交通
          </button>
        </div>
        <div id="transport-list" class="space-y-2.5"></div>
      </div>

      <div class="bg-white rounded-3xl border-comic p-4 shadow-comic space-y-3">
        <div class="flex items-center justify-between border-b-comic pb-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg bg-coral border-comic flex items-center justify-center text-xs">🏨</span>
            <h3 class="font-black text-base">住宿飯店</h3>
          </div>
          <button onclick="protectedAction(() => openAddHotelModal())" class="px-2.5 py-1 bg-coral rounded-xl border-comic text-xs font-black shadow-comic-sm">
            + 新增住宿
          </button>
        </div>
        <div id="hotel-list" class="space-y-3"></div>
      </div>
    </section>

    <!-- 待辦清單與分帳 -->
    <section id="budget-todo" class="space-y-5">
      <div class="bg-white rounded-3xl border-comic p-4 shadow-comic space-y-3">
        <div class="flex items-center justify-between border-b-comic pb-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg bg-wakatake border-comic flex items-center justify-center text-xs">🎒</span>
            <h3 class="font-black text-base">行前行李清單</h3>
          </div>
          <button onclick="protectedAction(openAddTodoModal)" class="px-2.5 py-1 bg-wakatake rounded-xl border-comic text-xs font-black shadow-comic-sm">
            + 新增項目
          </button>
        </div>
        <div id="todo-list" class="space-y-2"></div>
      </div>

      <div class="bg-white rounded-3xl border-comic p-4 shadow-comic space-y-4">
        <div class="flex items-center justify-between border-b-comic pb-2">
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg bg-yamabuki border-comic flex items-center justify-center text-xs">💰</span>
            <h3 class="font-black text-base">多人記帳與結算</h3>
          </div>
          <div class="flex gap-1.5">
            <button onclick="protectedAction(openAddMemberModal)" class="px-2.5 py-1 bg-washi rounded-xl border-comic text-xs font-black shadow-comic-sm">
              旅伴設定
            </button>
            <button onclick="protectedAction(openAddExpenseModal)" class="px-2.5 py-1 bg-coral rounded-xl border-comic text-xs font-black shadow-comic-sm">
              + 記一筆
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs font-bold text-gray-500">共同旅伴：</span>
          <div id="member-badges" class="flex flex-wrap gap-1.5"></div>
        </div>

        <div class="p-3 bg-washi rounded-2xl border-comic flex items-center justify-between">
          <div>
            <span class="text-xs font-bold text-gray-500">旅程總支出</span>
            <div class="text-xl font-black text-sumi">NT$ <span id="total-expenses-amount">0</span></div>
          </div>
          <button onclick="triggerSettlementConfirm()" class="px-3.5 py-2 bg-yamabuki rounded-2xl border-comic text-xs font-black shadow-comic-sm flex items-center gap-1">
            <i data-lucide="calculator" class="w-4 h-4"></i>
            <span>智慧平帳結算</span>
          </button>
        </div>

        <div class="space-y-2">
          <h4 class="text-xs font-black text-gray-500">最近支出紀錄</h4>
          <div id="expense-list" class="space-y-2 max-h-56 overflow-y-auto no-scrollbar"></div>
        </div>

        <div id="settlement-results-card" class="hidden p-3.5 bg-mizu/20 rounded-2xl border-comic space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-sumi flex items-center gap-1">✨ 最少交易次數結算方案</span>
            <span class="text-[11px] font-bold text-gray-500">兩兩直接清算</span>
          </div>
          <div id="settlement-transactions" class="space-y-1.5"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 全域模態彈窗 -->
  <div id="global-modal" class="fixed inset-0 z-50 bg-sumi/50 flex items-center justify-center px-4 hidden">
    <div id="modal-box" class="bg-white rounded-3xl border-comic p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto shadow-comic-lg">
      <div class="flex items-center justify-between border-b-comic pb-2 mb-4">
        <h3 id="modal-title" class="text-base font-black">彈窗標題</h3>
        <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-washi border-comic flex items-center justify-center font-black text-sm hover:bg-coral transition-colors">✕</button>
      </div>
      <div id="modal-content" class="space-y-3"></div>
    </div>
  </div>

  <script>
    /* ============================================================
       1. Firebase 設定與多房間架構
       ============================================================ */
    const firebaseConfig = {
      apiKey: "AIzaSyA3AjwK4a2xHmhLpsIGeJKPLxw3kU_Xx8g",
      authDomain: "our-trip-1c496.firebaseapp.com",
      databaseURL: "https://our-trip-1c496-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "our-trip-1c496",
      storageBucket: "our-trip-1c496.firebasestorage.app",
      messagingSenderId: "61566627655",
      appId: "1:61566627655:web:3b81780f802da3ee3ba662"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 取得當前旅程 ID (預設為 default)
    // 取得網址參數或本機最後開啟的紀錄 (不預設強迫建立 default)
    const urlParams = new URLSearchParams(window.location.search);
    const paramTrip = urlParams.get('trip');
    const storedHistory = getStoredTripList();
    let currentTripId = paramTrip || localStorage.getItem('last_active_trip') || (storedHistory.length > 0 ? storedHistory[0].id : null);
    let currentPin = null;
    let isUnlocked = false;

    // 取得本機手札庫清單 (預設為空陣列，絕不自動塞入假計畫)
    function getStoredTripList() {
      try {
        const list = JSON.parse(localStorage.getItem('my_trip_history'));
        return Array.isArray(list) ? list : [];
      } catch (e) {
        return [];
      }
    }

    // 只有明確建立或透過連結開啟有效計畫時，才收錄進本機手札庫
    function recordTripToHistory(id, title) {
      if (!id) return;
      let list = getStoredTripList();
      const existing = list.find(x => x.id === id);
      if (existing) {
        existing.title = title || existing.title;
      } else {
        list.push({ id, title: title || '未命名旅程' });
      }
      localStorage.setItem('my_trip_history', JSON.stringify(list));
      localStorage.setItem('last_active_trip', id);
    }

    const defaultAppData = {
      meta: {
        title: "我的精彩旅程",
        destination: "日本・東京",
        cityWeatherQuery: "東京都",
        startDate: "2026-11-20",
        endDate: "2026-11-25"
      },
      currentSelectedDay: 1,
      weatherCache: { temp: "16°C", condition: "晴朗舒適", rain: "10%", icon: "☀️" },
      itinerary: [],
      transports: [],
      hotels: [],
      todos: [
        { id: "todo-1", text: "檢查護照與行李", done: false }
      ],
      members: ["我"],
      expenses: []
    };

    let appData = JSON.parse(JSON.stringify(defaultAppData));
    let tripRef = null;

    // 監聽雲端資料 (嚴格模式：絕不自動建立新計畫)
    function listenToCurrentTrip() {
      if (tripRef) tripRef.off();

      // 若完全沒有指定行程且本機無紀錄，顯示歡迎引導畫面
      if (!currentTripId) {
        showEmptyWelcomeScreen();
        return;
      }

      tripRef = db.ref('trips/' + currentTripId);

      tripRef.on('value', (snapshot) => {
        const cloud = snapshot.val();
        if (cloud && cloud.appData) {
          // 有效旅程：讀取資料並收錄至本機手札庫
          currentPin = cloud.pin || null;
          appData = cloud.appData;
          recordTripToHistory(currentTripId, appData.meta.title);
          renderAll();
          checkSessionPin();
        } else {
          // 雲端查無此計畫 (網址錯誤或已被刪除)：絕不自動建立！
          // 從本機紀錄中移除該失效 ID
          let list = getStoredTripList().filter(x => x.id !== currentTripId);
          localStorage.setItem('my_trip_history', JSON.stringify(list));
          if (localStorage.getItem('last_active_trip') === currentTripId) {
            localStorage.removeItem('last_active_trip');
          }
          
          // 清除網址列無效參數
          window.history.replaceState({}, document.title, window.location.pathname);
          currentTripId = null;
          showEmptyWelcomeScreen("找不到該旅程計畫，可能連結有誤或已被主揪刪除。");
        }
      });
    }

    // 無計畫時的引導畫面
    function showEmptyWelcomeScreen(alertMsg = null) {
      document.getElementById('nav-title').textContent = "旅行手札";
      document.getElementById('hero-title').textContent = "尚未選擇旅程計畫";
      document.getElementById('hero-dest').textContent = "點擊右上角「+ 新計畫」開始";
      document.getElementById('hero-date-range').textContent = "或透過旅伴分享的專屬連結加入行程";
      
      if (alertMsg) {
        showCustomAlert(alertMsg);
      } else {
        openTripManagerModal();
      }
    }

    function saveAppData() {
      if (!currentTripId || !tripRef) return;
      tripRef.child('appData').set(appData);
      recordTripToHistory(currentTripId, appData.meta.title);
    }
    /* ============================================================
       2. PIN 碼安全共編機制 (無 PIN 則所有人可編；有 PIN 需解鎖)
       ============================================================ */
    function checkSessionPin() {
      const savedPin = localStorage.getItem('unlocked_' + currentTripId);
      if (!currentPin || savedPin === currentPin) {
        isUnlocked = true;
      } else {
        isUnlocked = false;
      }
      updateLockBadge();
    }

    function updateLockBadge() {
      const badge = document.getElementById('lock-status-badge');
      if (!currentPin) {
        badge.innerHTML = "🔓 公開共編";
        badge.className = "text-[10px] font-black px-1.5 py-0.2 rounded bg-wakatake/30 text-sumi border-comic";
      } else if (isUnlocked) {
        badge.innerHTML = "✏️ 已解鎖共編";
        badge.className = "text-[10px] font-black px-1.5 py-0.2 rounded bg-yamabuki text-sumi border-comic";
      } else {
        badge.innerHTML = "🔒 訪客唯讀 (點擊解鎖)";
        badge.className = "cursor-pointer text-[10px] font-black px-1.5 py-0.2 rounded bg-coral text-white border-comic";
      }
    }

    // 攔截所有新增/編輯動作
    function protectedAction(callback) {
      if (!currentPin || isUnlocked) {
        callback();
        return;
      }
      promptUnlockPin(callback);
    }

    function promptUnlockPin(onSuccessCallback = null) {
      if (!currentPin) {
        showCustomAlert("此旅程未設定 PIN 碼，所有旅伴皆可自由編輯！");
        return;
      }
      if (isUnlocked) {
        showCustomAlert("您已經成功解鎖共編權限！");
        return;
      }
      openModal("解鎖共編權限", `
        <div class="space-y-3 text-center text-xs font-bold">
          <p class="text-gray-600">此旅程已受 PIN 碼防護，請輸入 4 位數密碼以啟用編輯：</p>

    function submitVerifyPin() {
      const pin = document.getElementById('input-verify-pin').value.trim();
      if (pin === currentPin) {
        isUnlocked = true;
        localStorage.setItem('unlocked_' + currentTripId, pin);
        updateLockBadge();
        closeModal();
        if (window._pinCallback) {
          window._pinCallback();
          window._pinCallback = null;
        }

        showCustomAlert("PIN 碼錯誤！請向主揪確認。");
      }
    }

    function deleteTripFromHistory(targetId, targetTitle) {
      openModal("確認刪除計畫", `
        <div class="space-y-4 text-center text-xs font-bold">
          <p class="text-sm text-sumi py-2">確定要刪除「<span class="text-coral font-black">${targetTitle}</span>」嗎？<br><span class="text-gray-500 text-xs">刪除後雲端與本機資料將無法恢復！</span></p>
          <div class="flex gap-2">
            <button onclick="openTripManagerModal()" class="flex-1 py-2 bg-washi rounded-2xl border-comic font-black">取消</button>
            <button onclick="executeDeleteTrip('${targetId}')" class="flex-1 py-2 bg-coral rounded-2xl border-comic font-black">確認刪除</button>
         </div>
        </div>
      `);
      safeLucide();
    }

function executeDeleteTrip(targetId) {
      let list = getStoredTripList().filter(x => x.id !== targetId);
      localStorage.setItem('my_trip_history', JSON.stringify(list));
      localStorage.removeItem('unlocked_' + targetId);
      if (localStorage.getItem('last_active_trip') === targetId) {
        localStorage.removeItem('last_active_trip');
      }

      db.ref('trips/' + targetId).remove().then(() => {
        if (targetId === currentTripId) {
          // 若刪除的是目前開啟的計畫，跳轉回乾淨首頁（不帶任何參數，也不自動建新檔）
          window.location.href = window.location.pathname;
        } else {
          openTripManagerModal();
        }
      });
    }

    function confirmCreateNewTrip() {
      const name = document.getElementById('new-trip-name').value.trim();
      const pin = document.getElementById('new-trip-pin').value.trim() || null;
      if (!name) {
        showCustomAlert("請填寫旅程名稱！");
        return;
      }

      // 自動產生 6 碼隨機代碼
      const newId = 'trip_' + Math.random().toString(36).substring(2, 8);
      const newAppData = JSON.parse(JSON.stringify(defaultAppData));
      newAppData.meta.title = name;

      db.ref('trips/' + newId).set({
        pin: pin,
        appData: newAppData
      }).then(() => {
        if (pin) localStorage.setItem('unlocked_' + newId, pin);
        recordTripToHistory(newId, name);
        closeModal();
        switchTrip(newId);
      });
    }

    function switchTrip(targetId) {
      const newUrl = `${window.location.origin}${window.location.pathname}?trip=${targetId}`;
      window.location.href = newUrl;
    }

    function copyShareLink(url) {

    function copyLineSummary() {
      let text = `【${appData.meta.title}】\n📅 日期：${appData.meta.startDate} ~ ${appData.meta.endDate}\n📍 目的地：${appData.meta.destination}\n`;
      text += `-------------------------\n`;
      const { totalDays } = calculateDays();
      for (let d = 1; d <= totalDays; d++) {
        text += `\n📍 Day ${d}：\n`;
        const items = appData.itinerary.filter(i => i.day === d).sort((a,b) => a.time.localeCompare(b.time));
        if (items.length === 0) {
          text += `  (自由活動)\n`;
        } else {
          items.forEach(it => {
            text += `  • ${it.time} ${it.title} (${it.location})\n`;
          });
        }
      }
      text += `\n🔗 線上手帳：${window.location.origin}${window.location.pathname}?trip=${currentTripId}`;

      navigator.clipboard.writeText(text).then(() => {
        showCustomAlert("行程文字已複製！可以直接貼到 LINE 群組囉！");
      });
    }

    /* ============================================================
       5. 畫面渲染與模組 (保留原本手帳所有功能)
       ============================================================ */
    function safeLucide() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
    }

    function calculateDays() {
      const start = new Date(appData.meta.startDate);
      const end = new Date(appData.meta.endDate);
      const diffTime = Math.abs(end - start);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      const today = new Date(); today.setHours(0,0,0,0);
      const targetStart = new Date(appData.meta.startDate); targetStart.setHours(0,0,0,0);
      const countDiff = Math.ceil((targetStart - today) / (1000 * 60 * 60 * 24));
      return { totalDays: Math.max(diffDays || 1, 1), countdown: countDiff };
    }

      renderHero();

      document.getElementById('hero-start-date').textContent = appData.meta.startDate;
      document.getElementById('hero-countdown-days').textContent = countdown >= 0 ? countdown : 0;
      document.getElementById('hero-partner-count').textContent = `${(appData.members || []).length} 人成行`;
    }

    function renderDayTabs() {
      const { totalDays } = calculateDays();

      container.innerHTML = '';

      for (let day = 1; day <= totalDays; day++) {

        const btn = document.createElement('button');
        btn.className = `flex-shrink-0 px-4 py-2 rounded-2xl border-comic font-black text-xs transition-all ${
          isSelected ? 'bg-yamabuki text-sumi shadow-comic scale-105' : 'bg-white text-gray-700 shadow-comic-sm'
        }`;

        btn.onclick = () => {

    function saveItinerary(editId) {
      const day = Number(document.getElementById('item-day').value);
      const time = document.getElementById('item-time').value;
      const title = document.getElementById('item-title').value.trim();
      const loc = document.getElementById('item-loc').value.trim();
      const note = document.getElementById('item-note').value.trim();
      if (!title) return;

      if (editId) {
        const item = appData.itinerary.find(i => i.id === editId);
        if (item) Object.assign(item, { day, time, title, location: loc, note });
      } else {
        appData.itinerary.push({ id: 'item-' + Date.now(), day, time, title, location: loc, note });
      }
      appData.currentSelectedDay = day;
      saveAppData();
      closeModal();
      renderAll();
    }

      appData.itinerary = appData.itinerary.filter(i => i.id !== id);

   function openAddExpenseModal() {
      if (!appData.members || appData.members.length === 0) {
        showCustomAlert("目前還沒有旅伴，請先點選「旅伴設定」新增成員！");
        return;
      }
      const memberOptions = appData.members.map(m => `<option value="${m}">${m}</option>`).join('');
      const checkboxes = appData.members.map(m => `
        <label class="flex items-center gap-1.5 p-1.5 bg-washi rounded-lg border-comic cursor-pointer text-xs font-black">
          <input type="checkbox" name="expense_member_check" value="${m}" checked class="rounded border-comic w-4 h-4">
          <span>${m}</span>
        </label>
      `).join('');

      openModal("記帳支出", `
        <form class="space-y-3 text-xs font-bold" onsubmit="return false;">
          <div>
            <label class="block mb-1">消費品項名稱</label>
            <input type="text" id="exp-title" placeholder="例: 居酒屋晚餐、晴空塔門票" class="w-full p-2 bg-washi rounded-xl border-comic font-black text-sm">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block mb-1">金額 (NTD)</label>
              <input type="number" id="exp-amt" min="1" placeholder="金額" class="w-full p-2 bg-washi rounded-xl border-comic font-black text-sm">
            </div>
            <div>
              <label class="block mb-1">誰代墊付款？</label>
              <select id="exp-payer" class="w-full p-2 bg-washi rounded-xl border-comic font-black text-xs">
                ${memberOptions}
              </select>
            </div>
          </div>
          <div>
            <label class="block mb-1">誰參與分攤？(可複選)</label>
            <div class="flex flex-wrap gap-2 pt-1">
              ${checkboxes}
            </div>
          </div>
          <button type="button" onclick="saveExpense()" class="w-full py-2.5 bg-coral rounded-2xl border-comic font-black text-sm shadow-comic-sm hover:scale-102 active:scale-95 transition-transform mt-2">
            儲存這筆支出
          </button>
        </form>
      `);
    }

    function saveExpense() {
      const titleInput = document.getElementById('exp-title');
      const amtInput = document.getElementById('exp-amt');
      const payerSelect = document.getElementById('exp-payer');

      const title = titleInput ? titleInput.value.trim() : '';
      const amount = amtInput ? Number(amtInput.value) : 0;
      const payer = payerSelect ? payerSelect.value : '';

      // 精準取得所有被勾選的分攤成員
      const checkedEls = document.querySelectorAll('input[name="expense_member_check"]:checked');
      const participants = Array.from(checkedEls).map(e => e.value);

      // 明確防呆提示
      if (!title) {
        showCustomAlert("請填寫品項名稱！");
        return;
      }
      if (!amount || amount <= 0) {
        showCustomAlert("請輸入大於 0 的有效金額！");
        return;
      }
      if (participants.length === 0) {
        showCustomAlert("請至少勾選一位參與分攤的成員！");
        return;
      }

      if (!Array.isArray(appData.expenses)) {
        appData.expenses = [];
      }

      // 新增支出紀錄
      appData.expenses.unshift({
        id: 'exp-' + Date.now(),
        title: title,
        amount: amount,
        payer: payer,
        participants: participants,
        date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })
      });

      // 隱藏舊的平帳卡片，促使用戶重新試算
      const settleCard = document.getElementById('settlement-results-card');
      if (settleCard) settleCard.classList.add('hidden');

      // 儲存資料並關閉彈窗
      saveAppData();
      closeModal();

      // 立即刷新畫面上的支出清單與總金額
      renderBudgetModule();
      safeLucide();
    }

    function deleteExpense(id) {
      appData.expenses = appData.expenses.filter(e => e.id !== id);
      document.getElementById('settlement-results-card').classList.add('hidden');
      saveAppData();
      renderBudgetModule();
    }

   function triggerSettlementConfirm() {
      if (!appData.expenses || appData.expenses.length === 0) {
        showCustomAlert("目前還沒有任何支出資料可以結算喔！");
        return;
      }

      // 1. 計算每個人在此趟旅程的淨收支 (Net Balance)
      const balances = {};
      appData.members.forEach(m => balances[m] = 0);

      appData.expenses.forEach(e => {
        const amt = Math.round(Number(e.amount));
        balances[e.payer] = (balances[e.payer] || 0) + amt;

        // 單次分攤金額採嚴格四捨五入至整數
        const share = Math.round(amt / e.participants.length);
        e.participants.forEach(p => {
          balances[p] = (balances[p] || 0) - share;
        });
      });

      // 2. 將每位成員的總餘額嚴格四捨五入為整數，區分為「該付錢者 (debtors)」與「該收錢者 (creditors)」
      const debtors = [];
      const creditors = [];

      for (const [p, bal] of Object.entries(balances)) {
        const finalBal = Math.round(bal);
        if (finalBal < 0) {
          debtors.push({ p, amt: Math.abs(finalBal) });
        } else if (finalBal > 0) {
          creditors.push({ p, amt: finalBal });
        }
      }

      // 3. 依金額大到小排序，以達到最少筆數結清
      debtors.sort((a, b) => b.amt - a.amt);
      creditors.sort((a, b) => b.amt - a.amt);

      const txs = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        // 取兩者之間較小的值，並進行四捨五入確保完全是整數
        const settleAmt = Math.round(Math.min(debtors[i].amt, creditors[j].amt));

        if (settleAmt >= 1) {
          txs.push({
            from: debtors[i].p,
            to: creditors[j].p,
            amt: settleAmt
          });
        }

        debtors[i].amt = Math.round(debtors[i].amt - settleAmt);
        creditors[j].amt = Math.round(creditors[j].amt - settleAmt);

        if (debtors[i].amt <= 0) i++;
        if (creditors[j].amt <= 0) j++;
      }

      // 4. 渲染至畫面
      const card = document.getElementById('settlement-results-card');
      const list = document.getElementById('settlement-transactions');
      card.classList.remove('hidden');

      if (txs.length === 0) {
        list.innerHTML = '<div class="text-center text-xs font-bold py-2 text-gray-600">大家剛好都平攤了，無需轉帳！🎉</div>';
      } else {
        list.innerHTML = txs.map(t => `
          <div class="flex items-center justify-between p-2.5 bg-white rounded-xl border-comic text-xs font-black shadow-comic-sm">
            <div class="flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded bg-coral/30 text-sumi border-comic">${t.from}</span>
              <span class="text-gray-400">應付給 ➔</span>
              <span class="px-2 py-0.5 rounded bg-wakatake text-sumi border-comic">${t.to}</span>
            </div>
            <div class="text-coral text-sm">NT$ ${Math.round(t.amt).toLocaleString()}</div>
          </div>
        `).join('');
      }
      card.scrollIntoView({ behavior: 'smooth' });
    }

    // 啟動監聽
    listenToCurrentTrip();
  </script>
