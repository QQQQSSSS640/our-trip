  <style>
    body {
      background-color: #FFFCF6;
      color: #3E3A39;
      font-family: 'Zen Maru Gothic', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .border-comic { border: 3px solid #3E3A39; }
    .border-b-comic { border-bottom: 3px solid #3E3A39; }
    .border-t-comic { border-top: 3px solid #3E3A39; }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    @keyframes bounceTab {
      0% { transform: scale(0.9); }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .animate-float { animation: gentleFloat 4s ease-in-out infinite; }
    .animate-float-delayed { animation: gentleFloat 4.5s ease-in-out 1.5s infinite; }
    .animate-bounce-tab { animation: bounceTab 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }

    @media (prefers-reduced-motion: reduce) {
      .animate-float, .animate-float-delayed, .animate-bounce-tab, * {
        animation: none !important;
        transition: none !important;
      }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .todo-strike.checked span.todo-text {
      color: #9CA3AF;
      text-decoration: line-through;
      text-decoration-thickness: 2.5px;
      text-decoration-color: #F2A497;
    }

      <div class="bg-white rounded-3xl border-comic p-4 shadow-comic space-y-4">
        <div class="flex items-center justify-between border-b-comic pb-2">

          <div>
            <span class="text-xs font-bold text-gray-500">旅程總支出</span>

            <span>智慧平帳結算</span>

        </div>

        <div class="space-y-2">

          <div id="expense-list" class="space-y-2 max-h-56 overflow-y-auto no-scrollbar"></div>
        </div>

        <div id="settlement-results-card" class="hidden p-3.5 bg-mizu/20 rounded-2xl border-comic space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-sumi flex items-center gap-1">✨ 最少交易次數結算方案</span>
            <span class="text-[11px] font-bold text-gray-500">兩兩直接清算</span>
          </div>
          <div id="settlement-transactions" class="space-y-1.5"></div>
        </div>
      </div>
    </section>

    <!-- 底部重置 -->
    <div class="text-center pt-2 pb-6">
      <button onclick="resetToDefaultDataPrompt()" class="text-xs text-gray-400 font-bold hover:text-coral transition-colors underline">

      </button>
      <p class="text-[11px] text-gray-400 mt-1">手帳資料自動安全即時同步於 Firebase 雲端</p>
    </div>
  </main>

    /* ============================================================

       ============================================================ */
    function calculateDays() {
      if (!appData || !appData.meta) return { totalDays: 1, countdown: 0 };
      const start = new Date(appData.meta.startDate);
      const end = new Date(appData.meta.endDate);
      const diffTime = Math.abs(end - start);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

      const today = new Date();
      today.setHours(0,0,0,0);
      const targetStart = new Date(appData.meta.startDate);
      targetStart.setHours(0,0,0,0);

      const countDiff = Math.ceil((targetStart - today) / (1000 * 60 * 60 * 24));
      return { totalDays: Math.max(diffDays || 1, 1), countdown: countDiff };
    }

    function triggerSettlementConfirm() {
      if (!appData.expenses || appData.expenses.length === 0) {
        showCustomAlert("目前還沒有任何支出資料可以結算喔！");
        return;
      }
      openCustomConfirm("即將進行【最小次數平帳計算】。\n這將計算誰該給誰多少錢，以最少轉帳次數結算清白，是否確認計算？", () => {
        calculateAndDisplaySettlement();
      });
    }

    function calculateAndDisplaySettlement() {
      const balances = {};
      appData.members.forEach(m => balances[m] = 0);

      appData.expenses.forEach(exp => {
        const amount = Number(exp.amount);
        const payer = exp.payer;
        const participants = exp.participants || [];

        if (balances[payer] === undefined) balances[payer] = 0;
        balances[payer] += amount;

        const share = participants.length > 0 ? (amount / participants.length) : 0;
        participants.forEach(p => {
          if (balances[p] === undefined) balances[p] = 0;
          balances[p] -= share;
        });
      });

      const debtors = [];
      const creditors = [];

      for (const [person, bal] of Object.entries(balances)) {
        const rounded = Math.round(bal);
        if (rounded < -1) debtors.push({ person, amount: -rounded });
        else if (rounded > 1) creditors.push({ person, amount: rounded });
      }

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const transactions = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        const debit = debtors[i].amount;
        const credit = creditors[j].amount;
        const settle = Math.min(debit, credit);

        transactions.push({
          from: debtors[i].person,
          to: creditors[j].person,
          amount: Math.round(settle)
        });

        debtors[i].amount -= settle;
        creditors[j].amount -= settle;

        if (debtors[i].amount <= 1) i++;
        if (creditors[j].amount <= 1) j++;
      }

      const card = document.getElementById('settlement-results-card');
      const list = document.getElementById('settlement-transactions');
      card.classList.remove('hidden');
      list.innerHTML = '';

      if (transactions.length === 0) {
        list.innerHTML = `<div class="text-xs font-bold text-gray-600 text-center py-2">大家剛好都平攤了，無需任何轉帳！🎉</div>`;
      } else {
        transactions.forEach(t => {
          const row = document.createElement('div');
          row.className = "flex items-center justify-between p-2.5 bg-white rounded-xl border-comic text-xs font-black shadow-comic-sm";
          row.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded-lg bg-coral/40 text-sumi border-comic">${t.from}</span>
              <span class="text-gray-400">應付給 ➔</span>
              <span class="px-2 py-0.5 rounded-lg bg-wakatake text-sumi border-comic">${t.to}</span>
            </div>
            <div class="text-coral font-black text-sm">NT$ ${t.amount.toLocaleString()}</div>
          `;
          list.appendChild(row);
        });
      }
      safeLucide();
      card.scrollIntoView({ behavior: 'smooth' });
    }

              <input type="date" id="m-start" value="${appData.meta.startDate}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
            </div>
            <div>
              <label class="block mb-1">結束日</label>
              <input type="date" id="m-end" value="${appData.meta.endDate}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
            </div>
          </div>
          <button type="button" onclick="saveTripMeta()" class="w-full py-2.5 mt-2 bg-yamabuki rounded-2xl border-comic font-black text-sm shadow-comic-sm">
            儲存變更
          </button>
        </form>
      `);
    }

    function saveTripMeta() {
      const title = document.getElementById('m-title').value.trim();
      const dest = document.getElementById('m-dest').value.trim();
      const start = document.getElementById('m-start').value;
      const end = document.getElementById('m-end').value;

      if (!title || !dest || !start || !end) {
        showCustomAlert("請填寫完整欄位！");
        return;
      }

      appData.meta.title = title;
      appData.meta.destination = dest;
      appData.meta.cityWeatherQuery = dest.split('・')[1] || dest;
      appData.meta.startDate = start;
      appData.meta.endDate = end;

      saveAppData();
      closeModal();
      renderAll();
    }

    function openAddItemModal(editId = null) {
      const { totalDays } = calculateDays();
      let item = { day: appData.currentSelectedDay, time: "10:00", category: "spot", title: "", location: "", mustVisit: false, note: "", navMode: "transit" };
      if (editId) {
        item = appData.itinerary.find(i => i.id === editId) || item;
      }

      let dayOptions = '';
      for (let d = 1; d <= totalDays; d++) {
        dayOptions += `<option value="${d}" ${item.day === d ? 'selected' : ''}>第 ${d} 天</option>`;
      }

      openModal(editId ? "修改行程活動" : "新增行程項目", `
        <form class="space-y-3 text-xs font-bold">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block mb-1">行程天數</label>
              <select id="item-day" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
                ${dayOptions}
              </select>
            </div>
            <div>
              <label class="block mb-1">時間</label>
              <input type="time" id="item-time" value="${item.time}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block mb-1">活動分類</label>
              <select id="item-cat" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
                <option value="spot" ${item.category === 'spot' ? 'selected' : ''}>📷 景點探索</option>
                <option value="food" ${item.category === 'food' ? 'selected' : ''}>🍴 特色美食</option>
                <option value="transport" ${item.category === 'transport' ? 'selected' : ''}>🚆 交通移動</option>
              </select>
            </div>
            <div>
              <label class="block mb-1">預設導航方式</label>
              <select id="item-nav" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
                <option value="transit" ${item.navMode === 'transit' ? 'selected' : ''}>🚇 大眾運輸</option>
                <option value="driving" ${item.navMode === 'driving' ? 'selected' : ''}>🚗 自行開車</option>
                <option value="walking" ${item.navMode === 'walking' ? 'selected' : ''}>🚶 步行探索</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block mb-1">活動名稱</label>
            <input type="text" id="item-title" placeholder="如：淺草雷門散策" value="${item.title}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
          </div>
          <div>
            <label class="block mb-1">地點 (供 Google Maps 導航)</label>
            <input type="text" id="item-loc" placeholder="如：淺草寺" value="${item.location}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
          </div>
          <div class="flex items-center gap-2 py-1">
            <input type="checkbox" id="item-must" ${item.mustVisit ? 'checked' : ''} class="w-4 h-4 rounded border-comic">
            <label for="item-must" class="font-black text-coral cursor-pointer">標記為「★ 必去行程」</label>
          </div>
          <div>
            <label class="block mb-1">備註提醒</label>
            <input type="text" id="item-note" placeholder="如：領取西瓜卡" value="${item.note || ''}" class="w-full p-2 bg-washi rounded-xl border-comic font-bold">
          </div>
          <button type="button" onclick="saveItineraryItem('${editId || ''}')" class="w-full py-2.5 mt-2 bg-wakatake rounded-2xl border-comic font-black text-sm shadow-comic-sm">
            ${editId ? '更新行程' : '新增至時間軸'}
          </button>
        </form>
      `);
    }

    function openEditItemModal(id) { openAddItemModal(id); }

    function saveItineraryItem(editId) {
      const day = Number(document.getElementById('item-day').value);
      const time = document.getElementById('item-time').value;
      const cat = document.getElementById('item-cat').value;
      const navMode = document.getElementById('item-nav').value;
      const title = document.getElementById('item-title').value.trim();
      const loc = document.getElementById('item-loc').value.trim();
      const must = document.getElementById('item-must').checked;
      const note = document.getElementById('item-note').value.trim();

      if (!title || !loc) {
        showCustomAlert("請填寫活動名稱與地點！");
        return;
      }

      if (editId) {
        const item = appData.itinerary.find(i => i.id === editId);
        if (item) {
          item.day = day; item.time = time; item.category = cat; item.navMode = navMode;
          item.title = title; item.location = loc; item.mustVisit = must; item.note = note;
        }
      } else {
        appData.itinerary.push({
          id: 'item-' + Date.now(), day, time, category: cat, navMode, title, location: loc, mustVisit: must, note
        });
      }

      appData.currentSelectedDay = day;
      saveAppData();
      closeModal();
      renderDayTabs();
      renderTimeline();
    }

    function deleteItineraryItem(id) {
      openCustomConfirm("確定要刪除這筆行程嗎？", () => {
        appData.itinerary = appData.itinerary.filter(i => i.id !== id);
        saveAppData();
        renderTimeline();
      });
    }

    function changeItemNavMode(id, newMode) {
      const item = appData.itinerary.find(i => i.id === id);
      if (item) {
        item.navMode = newMode;
        saveAppData();
        renderTimeline();
      }
    }

    function editWeatherModal() {
      openModal("自訂即時天氣資訊", `
        <form class="space-y-3 text-xs font-bold">
          <div>
            <label class="block mb-1">城市/地點</label>
            <input type="text" id="w-city" value="${appData.meta.cityWeatherQuery || ''}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block mb-1">溫度 (如 18°C)</label>
              <input type="text" id="w-temp" value="${appData.weatherCache.temp}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
            </div>
            <div>
              <label class="block mb-1">降雨機率 (如 10%)</label>
              <input type="text" id="w-rain" value="${appData.weatherCache.rain}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
            </div>
          </div>
          <div>
            <label class="block mb-1">天候狀態</label>
            <select id="w-cond" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
              <option value="晴朗舒適|☀️">☀️ 晴朗舒適</option>
              <option value="多雲微風|⛅">⛅ 多雲微風</option>
              <option value="細雨綿綿|🌧️">🌧️ 細雨綿綿</option>
              <option value="白雪皚皚|❄️">❄️ 白雪皚皚</option>
            </select>
          </div>
          <button type="button" onclick="saveWeather()" class="w-full py-2 bg-mizu rounded-2xl border-comic font-black text-sm shadow-comic-sm">
            儲存天氣卡片
          </button>
        </form>
      `);
    }

    function saveWeather() {
      const city = document.getElementById('w-city').value.trim();
      const temp = document.getElementById('w-temp').value.trim();
      const rain = document.getElementById('w-rain').value.trim();
      const [cond, icon] = document.getElementById('w-cond').value.split('|');

      appData.meta.cityWeatherQuery = city;
      appData.weatherCache = { temp, rain, condition: cond, icon };
      saveAppData();
      closeModal();
      renderWeather();
    }

    function openAddTransportModal(editId = null) {
      let t = { type: 'flight', title: '', departure: '', arrival: '', code: '', note: '' };
      if (editId) t = appData.transports.find(x => x.id === editId) || t;
      openModal(editId ? "修改交通車票" : "新增交通資訊", `
        <form class="space-y-3 text-xs font-bold">
          <div>
            <label class="block mb-1">交通類型</label>
            <select id="t-type" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
              <option value="flight" ${t.type === 'flight' ? 'selected' : ''}>✈️ 機票 / 航班</option>
              <option value="train" ${t.type === 'train' ? 'selected' : ''}>🚆 鐵路 / 新幹線 / 租車</option>
            </select>
          </div>
          <div>
            <label class="block mb-1">班次/名稱</label>
            <input type="text" id="t-title" value="${t.title}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block mb-1">出發</label>
              <input type="text" id="t-dep" placeholder="例: 11/20 08:50" value="${t.departure}" class="w-full p-2 bg-washi rounded-xl border-comic">
            </div>
            <div>
              <label class="block mb-1">抵達</label>
              <input type="text" id="t-arr" placeholder="例: 11/20 12:55" value="${t.arrival}" class="w-full p-2 bg-washi rounded-xl border-comic">
            </div>
          </div>
          <div>
            <label class="block mb-1">代碼 / 座位</label>
            <input type="text" id="t-code" value="${t.code || ''}" class="w-full p-2 bg-washi rounded-xl border-comic">
          </div>
          <div>
            <label class="block mb-1">備註</label>
            <input type="text" id="t-note" value="${t.note || ''}" class="w-full p-2 bg-washi rounded-xl border-comic">
          </div>
          <button type="button" onclick="saveTransport('${editId || ''}')" class="w-full py-2 bg-yamabuki rounded-2xl border-comic font-black text-sm shadow-comic-sm">
            儲存交通資訊
          </button>
        </form>
      `);
    }

    function openEditTransportModal(id) { openAddTransportModal(id); }

    function saveTransport(editId) {
      const type = document.getElementById('t-type').value;
      const title = document.getElementById('t-title').value.trim();
      const dep = document.getElementById('t-dep').value.trim();
      const arr = document.getElementById('t-arr').value.trim();
      const code = document.getElementById('t-code').value.trim();
      const note = document.getElementById('t-note').value.trim();

      if (!title) { showCustomAlert("請輸入交通名稱！"); return; }

      if (editId) {
        const item = appData.transports.find(x => x.id === editId);
        if (item) { Object.assign(item, { type, title, departure: dep, arrival: arr, code, note }); }
      } else {
        appData.transports.push({ id: 'trans-' + Date.now(), type, title, departure: dep, arrival: arr, code, note });
      }

      saveAppData();
      closeModal();
      renderTransports();
    }

    function deleteTransport(id) {
      openCustomConfirm("確定刪除此交通記錄嗎？", () => {
        appData.transports = appData.transports.filter(x => x.id !== id);
        saveAppData();
        renderTransports();
      });
    }

    function openAddHotelModal(editId = null) {
      let h = { name: '', address: '', dates: '', checkInOut: 'Check-in: 15:00 / Out: 11:00', bookingCode: '', note: '' };
      if (editId) h = appData.hotels.find(x => x.id === editId) || h;
      openModal(editId ? "編輯住宿飯店" : "新增住宿飯店", `
        <form class="space-y-3 text-xs font-bold">
          <div>
            <label class="block mb-1">飯店名稱</label>
            <input type="text" id="h-name" value="${h.name}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
          </div>
          <div>
            <label class="block mb-1">地址 (用於導航)</label>
            <input type="text" id="h-addr" value="${h.address}" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block mb-1">入住期間</label>
              <input type="text" id="h-dates" value="${h.dates}" class="w-full p-2 bg-washi rounded-xl border-comic">
            </div>
            <div>
              <label class="block mb-1">入住/退房時間</label>
              <input type="text" id="h-time" value="${h.checkInOut}" class="w-full p-2 bg-washi rounded-xl border-comic">
            </div>
          </div>
          <div>
            <label class="block mb-1">訂單代號</label>
            <input type="text" id="h-code" value="${h.bookingCode || ''}" class="w-full p-2 bg-washi rounded-xl border-comic">
          </div>
          <div>
            <label class="block mb-1">住宿備註</label>
            <input type="text" id="h-note" value="${h.note || ''}" class="w-full p-2 bg-washi rounded-xl border-comic">
          </div>
          <button type="button" onclick="saveHotel('${editId || ''}')" class="w-full py-2 bg-coral rounded-2xl border-comic font-black text-sm shadow-comic-sm">
            儲存飯店卡片
          </button>
        </form>
      `);
    }

    function openEditHotelModal(id) { openAddHotelModal(id); }

    function saveHotel(editId) {
      const name = document.getElementById('h-name').value.trim();
      const addr = document.getElementById('h-addr').value.trim();
      const dates = document.getElementById('h-dates').value.trim();
      const time = document.getElementById('h-time').value.trim();
      const code = document.getElementById('h-code').value.trim();
      const note = document.getElementById('h-note').value.trim();

      if (!name || !addr) { showCustomAlert("請填寫飯店名稱與地址！"); return; }

      if (editId) {
        const item = appData.hotels.find(x => x.id === editId);
        if (item) { Object.assign(item, { name, address: addr, dates, checkInOut: time, bookingCode: code, note }); }
      } else {
        appData.hotels.push({ id: 'hotel-' + Date.now(), name, address: addr, dates, checkInOut: time, bookingCode: code, note });
      }

      saveAppData();
      closeModal();
      renderHotels();
    }

    function deleteHotel(id) {
      openCustomConfirm("確定刪除此住宿資訊嗎？", () => {
        appData.hotels = appData.hotels.filter(x => x.id !== id);
        saveAppData();
        renderHotels();
      });
    }

    function openAddTodoModal() {
      openModal("新增待辦/行李準備", `
        <form class="space-y-3 text-xs font-bold">
          <div>
            <label class="block mb-1">項目內容</label>
            <input type="text" id="todo-input" placeholder="例: 隨身電源、護照檢查" class="w-full p-2.5 bg-washi rounded-xl border-comic font-black">
          </div>
          <button type="button" onclick="saveTodo()" class="w-full py-2 bg-wakatake rounded-2xl border-comic font-black text-sm shadow-comic-sm">
            加入待辦清單
          </button>
        </form>
      `);
    }

    function saveTodo() {
      const text = document.getElementById('todo-input').value.trim();
      if (!text) { showCustomAlert("請輸入待辦內容！"); return; }
      appData.todos.push({ id: 'todo-' + Date.now(), text, done: false });
      saveAppData();
      closeModal();
      renderTodos();
    }

    function toggleTodo(id) {
      const todo = appData.todos.find(t => t.id === id);
      if (todo) {
        todo.done = !todo.done;
        saveAppData();
        renderTodos();
      }
    }

    function deleteTodo(id) {
      appData.todos = appData.todos.filter(t => t.id !== id);
      saveAppData();
      renderTodos();
    }

    function openAddMemberModal() {
      openModal("管理旅伴成員", `
        <div class="space-y-3 text-xs font-bold">
          <p class="text-gray-500">旅伴名字將用於分攤費用：</p>
          <div id="member-editor-list" class="space-y-2">
            ${(appData.members || []).map((m, index) => `
              <div class="flex items-center justify-between p-2 bg-washi rounded-xl border-comic">
                <span class="font-black text-sumi">${m}</span>
                ${appData.members.length > 1 ? `
                  <button onclick="removeMember(${index})" class="text-coral hover:scale-110 font-black">✕</button>
                ` : ''}
              </div>
            `).join('')}
          </div>
          <div class="pt-2 flex gap-2">
            <input type="text" id="new-member-name" placeholder="新增旅伴姓名" class="flex-1 p-2 bg-washi rounded-xl border-comic font-black">
            <button onclick="addNewMember()" class="px-3 py-2 bg-mizu rounded-xl border-comic font-black shadow-comic-sm">新增</button>
          </div>
        </div>
      `);
    }

    function addNewMember() {
      const input = document.getElementById('new-member-name');
      const name = input.value.trim();
      if (!name) return;
      if (appData.members.includes(name)) {
        showCustomAlert("該旅伴名字已經存在囉！");
        return;
      }
      appData.members.push(name);
      saveAppData();
      openAddMemberModal();
      renderBudgetModule();
      renderHero();
    }

    function removeMember(index) {
      const name = appData.members[index];
      openCustomConfirm(`確定移除旅伴「${name}」嗎？`, () => {
        appData.members.splice(index, 1);
        saveAppData();
        openAddMemberModal();
        renderBudgetModule();
        renderHero();
      });
    }

    function openAddExpenseModal() {
      if (!appData.members || appData.members.length === 0) {
        showCustomAlert("請先在旅伴設定中新增成員！");
        return;
      }

      const memberOptions = appData.members.map(m => `<option value="${m}">${m}</option>`).join('');
      const checkboxes = appData.members.map(m => `
        <label class="flex items-center gap-1.5 p-1 bg-washi rounded-lg border-comic cursor-pointer text-xs font-black">
          <input type="checkbox" name="exp-participant" value="${m}" checked class="rounded border-comic">
          <span>${m}</span>
        </label>
      `).join('');

      openModal("記下一筆旅程支出", `
        <form class="space-y-3 text-xs font-bold">
          <div>
            <label class="block mb-1">支出品項名稱</label>
            <input type="text" id="exp-title" placeholder="例: 敘敘苑燒肉晚餐" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block mb-1">金額 (NTD)</label>
              <input type="number" id="exp-amount" placeholder="例: 3600" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
            </div>
            <div>
              <label class="block mb-1">誰付款？</label>
              <select id="exp-payer" class="w-full p-2 bg-washi rounded-xl border-comic font-black">
                ${memberOptions}
              </select>
            </div>
          </div>
          <div>
            <label class="block mb-1">誰分攤？(可多選)</label>
            <div class="flex flex-wrap gap-2 pt-1">
              ${checkboxes}
            </div>
          </div>
          <button type="button" onclick="saveExpense()" class="w-full py-2.5 mt-2 bg-coral rounded-2xl border-comic font-black text-sm shadow-comic-sm">
            儲存記帳
          </button>
        </form>
      `);
    }

    function saveExpense() {
      const title = document.getElementById('exp-title').value.trim();
      const amount = Number(document.getElementById('exp-amount').value);
      const payer = document.getElementById('exp-payer').value;

      const checkedEls = document.querySelectorAll('input[name="exp-participant"]:checked');
      const participants = Array.from(checkedEls).map(el => el.value);

      if (!title || !amount || amount <= 0) {
        showCustomAlert("請輸入正確的品項名稱與大於 0 的金額！");
        return;
      }
      if (participants.length === 0) {
        showCustomAlert("至少需勾選一位分攤人！");
        return;
      }

      appData.expenses.unshift({
        id: 'exp-' + Date.now(),
        title,
        amount,
        payer,
        participants,
        date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })
      });

      document.getElementById('settlement-results-card').classList.add('hidden');
      saveAppData();
      closeModal();
      renderBudgetModule();
    }

    function deleteExpense(id) {
      openCustomConfirm("確定刪除這筆支出紀錄嗎？", () => {
        appData.expenses = appData.expenses.filter(e => e.id !== id);
        document.getElementById('settlement-results-card').classList.add('hidden');
        saveAppData();
        renderBudgetModule();
      });
    }

    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    /* ============================================================
       6. 啟動與 Firebase 即時雙向綁定
       ============================================================ */
    // 立即先渲染一次本機預設資料，確保畫面絕不留白
    loadAppData();
    renderAll();

    // 如果 Firebase 連線成功，進行雲端即時同步
    if (tripRef) {
      tripRef.on('value', (snapshot) => {
        const cloudData = snapshot.val();
        if (cloudData) {
          appData = cloudData;
          renderAll();
        } else {
          tripRef.set(appData);
        }
      });
    }
  </script>
</body>
</html>
